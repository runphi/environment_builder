# The lab's DNS server, its gateway. eth0 has one static address in both boot
# modes (/etc/network/interfaces, or ip= of the TFTP+NFS boot) and no DHCP
# client, so nothing else sets one. This file replaces Buildroot's link to
# /tmp/resolv.conf, which only a DHCP client writes.
nameserver 192.168.100.254
